<html>
    <head>
        <link rel="stylesheet" href="style.css">
        
    </head>
    <body id="page">
        <aside>
            <h1 id="title">Notepad</h1>
            <button id="new-note">New +</button>
            <input placeholder="Search notes" id="search-notes">
            <div id="notes-list"></div>
        </aside>
        
        <main>
            <input id="note-title" placeholder="Untitled">
            <div id="text-editor">
                <textarea id="note-content" role="textbox" aria-multiline="true"></textarea>
                <iframe id="html-preview" title="Html Preview" sandbox="allow-same-origin" hidden></iframe>
                <div id="markdown-preview" hidden></div>
                <div id="rich-text-editor" hidden>
                    <div id="rich-text-toolbar">
                        <button id="bold-button"><b>B</b></button>
                        <button id="italic-button"><i>I</i></button>
                        <button id="underline-button"><u>U</u></button>
                        <button id="strike-button"><s>S</s></button>
                        <button id="link-button">Link</button>
                        <button id="heading1">H1</button>
                        <button id="heading2">H2</button>
                        <button id="numbered-list">Numbered List</button>
                        <button id="bulleted-list">Bulleted List</button>
                    </div>
                    <div id="rich-text-content"></div>
                </div>
                <br/>
                <br />
                <select id="editor-type">
                    <option selected value="text">Text</option>
                    <option value="html">HTML</option>
                    <option value="markdown">Markdown</option>
                    <option value="richtext">Rich Text</option>
                </select>
                <button id="fill-sample">Fill Sample</button>
                <button id="showFR">Find & Replace</button>
                <div id="find-replace" hidden>
                    <input id="find-text" placeholder="find-text">
                    <input id="replace-text" placeholder="replace-text">

                    <button id="find-button">Find</button>
                    <button id="replace-button">Replace</button>
                    <button id="replace-all-button">Replace All</button>
                    <button id="hideFR">Hide Find & Replace</button>
                </div>
            </div>
            <div id="action">
                <button id="save-note">Save</button>
                <button id="restore-note">Restore</button>
                <button id="delete-note">Delete</button>
                <button id="note-pin">📌 Pin</button>
                <button id="export-note">Export</button>
                <button id="share-note">Share</button>
                <div id="share-panel" hidden>
                    <h3>Share Note</h3>
                    <input id="share-email" type="email" placeholder="Collaborator's email">
                    <select id="share-permission">
                        <option value="view">Viewer</option>
                        <option value="edit">Editor</option>
                    </select>
                    <button id="generate-share-link">Generate Link</button>
                    <button id="copy-share-link" disabled>Copy Link</button>
                    <button id="close-share">Close</button>
                </div>
                </div>
                <button id="theme-toggle">Themes</button>
            </div>
            <div id="share-panel" hidden></div>
            <div id="note-stats">
            <p id="word-count">0 words</p>
            <p id="char-count">0 charecters</p>
            <p id="save-status">Saved</p>
            </div>
            <p id="footer">Made with love!</p>
        </main>
        <script type="module" src="script.js"></script>

    </body>
</html>
