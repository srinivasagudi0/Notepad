<html>
    <head>
        <link rel="stylesheet" href="style.css">
        
    </head>
    <body id="page">
        <aside>
            <h1 id="title">Notepad</h1>
            <button id="new-note">New +</button>
            <input placeholder="Search notes" id="search-notes">
            <div id="notes-list"></div>
        </aside>
        
        <main>
            <input id="note-title" placeholder="Untitled">
            <div id="text-editor">
                <textarea id="note-content" role="textbox" aria-multiline="true"></textarea>
                <iframe id="html-preview" title="Html Preview" sandbox="allow-same-origin" hidden></iframe>
                <div id="markdown-preview" hidden></div>
                <select id="editor-type">
                    <option selected value="text">Text</option>
                    <option value="html">HTML</option>
                    <option value="markdown">Markdown</option>
                </select>
            </div>
            <div id="action">
                <button id="save-note" onclick="SaveCurrent()">Save</button>
                <button id="delete-note">Delete</button>
                <button id="note-pin">📌 Pin</button>
                <button id="export-note">Export</button>
                <button id="theme-toggle">Themes</button>
            </div>
            <div id="note-stats">
            <p id="word-count">0 words</p>
            <p id="char-count">0 charecters</p>
            <p id="save-status">Saved</p>
            </div>
        </main>
        <script src="script.js"></script>
    </body>
</html>
